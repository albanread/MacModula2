[package]
name = "newm2-box"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Modula-2 for the BOX (64-bit RISC OS over Linux): the compiler and runtime as a static library for /init. See design/BOX_PORT.md."

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[features]
# box/hostcheck.sh: x86-64 objects from an Arm Mac
x86-check = ["newm2-llvm/x86-check"]

[[bin]]
name = "m2-hostcheck"
path = "src/hostcheck.rs"
required-features = ["x86-check"]

[dependencies]
newm2-ir = { path = "../src/newm2-ir" }
newm2-lexer = { path = "../src/newm2-lexer" }
newm2-llvm = { path = "../src/newm2-llvm", features = ["rosbox"] }
newm2-loader = { path = "../src/newm2-loader" }
newm2-parser = { path = "../src/newm2-parser" }
newm2-runtime = { path = "../src/newm2-runtime", features = ["rosbox"] }
newm2-sema = { path = "../src/newm2-sema" }
